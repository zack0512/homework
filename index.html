<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日作業板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 flex flex-col">

    <!-- 頂部導覽列 Header -->
    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 transition-colors">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-sky-500 text-white rounded-xl shadow-md shadow-sky-500/20">
                    <i class="fa-solid font-bold fa-book-open text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-400 bg-clip-text text-transparent">
                        每日作業板
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">輕鬆記錄，高效完成每一項學習任務</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- 深色 / 淺色模式切換 -->
                <button id="themeToggleBtn" title="切換主題" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-all">
                    <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                </button>
                <!-- 新增作業按鈕 -->
                <button onclick="openModal()" class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white px-4 py-2 rounded-xl shadow-lg shadow-sky-500/20 font-medium transition-all active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">新增作業</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- 進度統計儀表板 Dashboard Card -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80 dark:border-slate-700/80 transition-all">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-sky-500"></i> 今日學習進度
                    </h2>
                    <p id="progressSubtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">目前沒有任何作業，輕鬆一下吧！</p>
                </div>
                <div class="flex items-baseline gap-1 self-start sm:self-auto">
                    <span id="completedCount" class="text-3xl font-extrabold text-sky-600 dark:text-sky-400">0</span>
                    <span class="text-slate-400 font-medium">/</span>
                    <span id="totalCount" class="text-lg font-bold text-slate-600 dark:text-slate-400">0</span>
                    <span class="text-xs font-semibold text-slate-400 ml-1">項已完成</span>
                </div>
            </div>

            <!-- 進度條 Container -->
            <div class="w-full bg-slate-100 dark:bg-slate-700 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200/50 dark:border-slate-600/50">
                <div id="progressBar" class="bg-gradient-to-r from-sky-500 via-indigo-500 to-emerald-500 h-full rounded-full transition-all duration-500 ease-out w-0 shadow-sm"></div>
            </div>

            <!-- 狀態摘要標籤 Summary Badges -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5">
                <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700 flex items-center gap-3">
                    <div class="p-2 bg-blue-100 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400 rounded-lg">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400">全部作業</div>
                        <div id="statTotal" class="text-base font-bold">0</div>
                    </div>
                </div>
                <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700 flex items-center gap-3">
                    <div class="p-2 bg-amber-100 text-amber-600 dark:bg-amber-900/40 dark:text-amber-400 rounded-lg">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400">今日到期</div>
                        <div id="statDueToday" class="text-base font-bold">0</div>
                    </div>
                </div>
                <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700 flex items-center gap-3">
                    <div class="p-2 bg-rose-100 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400 rounded-lg">
                        <i class="fa-solid fa-spinner"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400">進行中</div>
                        <div id="statPending" class="text-base font-bold">0</div>
                    </div>
                </div>
                <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700 flex items-center gap-3">
                    <div class="p-2 bg-emerald-100 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-400 rounded-lg">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400">已完成</div>
                        <div id="statCompleted" class="text-base font-bold">0</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 控制與篩選列 Filter & Toolbar -->
        <section class="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
            
            <!-- 狀態頁籤 State Tabs -->
            <div class="flex p-1 bg-slate-200/60 dark:bg-slate-800 rounded-xl overflow-x-auto custom-scrollbar">
                <button onclick="setFilter('all')" id="filter-all" class="filter-tab active bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-400 shadow-sm font-bold flex-1 min-w-[70px] py-1.5 px-3 text-xs sm:text-sm rounded-lg transition-all">全部</button>
                <button onclick="setFilter('today')" id="filter-today" class="filter-tab flex-1 min-w-[80px] py-1.5 px-3 text-xs sm:text-sm font-medium rounded-lg transition-all text-slate-600 dark:text-slate-300">今日到期</button>
                <button onclick="setFilter('pending')" id="filter-pending" class="filter-tab flex-1 min-w-[70px] py-1.5 px-3 text-xs sm:text-sm font-medium rounded-lg transition-all text-slate-600 dark:text-slate-300">未完成</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-tab flex-1 min-w-[70px] py-1.5 px-3 text-xs sm:text-sm font-medium rounded-lg transition-all text-slate-600 dark:text-slate-300">已完成</button>
            </div>

            <!-- 下拉選單與搜尋 Dropdowns & Search -->
            <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
                <!-- 搜尋 Search -->
                <div class="relative flex-1 sm:w-48">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="renderHomeworks()" placeholder="搜尋作業..." class="w-full pl-8 pr-3 py-1.5 text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 dark:text-slate-100">
                </div>

                <!-- 科目選單 Subject Filter -->
                <select id="subjectFilter" onchange="renderHomeworks()" class="text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500 dark:text-slate-100">
                    <option value="all">所有科目</option>
                    <option value="國文">國文</option>
                    <option value="英文">英文</option>
                    <option value="數學">數學</option>
                    <option value="自然/科學">自然/科學</option>
                    <option value="社會">社會</option>
                    <option value="其他">其他</option>
                </select>

                <!-- 排序方式 Sort -->
                <select id="sortBy" onchange="renderHomeworks()" class="text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500 dark:text-slate-100">
                    <option value="dueDate">依截止日期</option>
                    <option value="priority">依優先順序</option>
                    <option value="created">依新增時間</option>
                </select>
            </div>
        </section>

        <!-- 作業列表 Container -->
        <section id="homeworkList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- JS 動態增刪項目 -->
        </section>

        <!-- 清空狀態 Empty State -->
        <div id="emptyState" class="flex flex-col items-center justify-center py-20 text-center bg-white dark:bg-slate-800/50 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700 shadow-sm">
            <div class="w-16 h-16 bg-sky-50 dark:bg-sky-950/40 text-sky-500 rounded-full flex items-center justify-center mb-4 text-2xl">
                <i class="fa-regular fa-folder-open"></i>
            </div>
            <h3 class="text-base font-bold text-slate-700 dark:text-slate-200">目前沒有作業，點擊上方按鈕新增作業吧！</h3>
            <p class="text-xs text-slate-400 mt-1 max-w-sm">建立屬於你的每日學習計畫，清晰掌握每一項作業進度與截止時間。</p>
            <button onclick="openModal()" class="mt-5 px-5 py-2.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white rounded-xl text-xs font-semibold shadow-lg shadow-sky-500/20 transition-all active:scale-95">
                <i class="fa-solid fa-plus mr-1.5"></i> 新增第一筆作業
            </button>
        </div>

    </main>

    <!-- 頁腳 Footer -->
    <footer class="mt-auto py-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400">
        <p>每日作業板 &copy; 2026 - 讓學習井然有序</p>
    </footer>

    <!-- 新增/編輯作業 Modal 對話盒 -->
    <div id="homeworkModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform scale-95 transition-transform duration-200" id="modalContainer">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 dark:border-slate-700">
                <h3 id="modalTitle" class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plus text-sky-500"></i> 新增作業
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="homeworkForm" onsubmit="handleFormSubmit(event)" class="mt-4 space-y-4">
                <input type="hidden" id="homeworkId">

                <!-- 作業標題 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">作業名稱 <span class="text-rose-500">*</span></label>
                    <input type="text" id="inputTitle" required placeholder="例如：習作 P.20-25 / 英文單字 Quiz" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <!-- 科目與優先級 Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 科目 -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">科目/類別</label>
                        <select id="inputSubject" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                            <option value="國文">國文</option>
                            <option value="英文">英文</option>
                            <option value="數學">數學</option>
                            <option value="自然/科學">自然/科學</option>
                            <option value="社會">社會</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <!-- 優先級 -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">優先順序</label>
                        <select id="inputPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                            <option value="high">🔴 高 (High)</option>
                            <option value="medium" selected>🟡 中 (Medium)</option>
                            <option value="low">🟢 低 (Low)</option>
                        </select>
                    </div>
                </div>

                <!-- 截止日期與時間 Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">截止日期 <span class="text-rose-500">*</span></label>
                        <input type="date" id="inputDueDate" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">截止時間</label>
                        <input type="time" id="inputDueTime" value="23:59" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <!-- 備註說明 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">詳細說明 / 備註</label>
                    <textarea id="inputNotes" rows="3" placeholder="添加相關連結、提示或注意事項..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 resize-none"></textarea>
                </div>

                <!-- 按鈕區 -->
                <div class="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
                        取消
                    </button>
                    <button type="submit" class="px-5 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-semibold shadow-md shadow-sky-500/20 transition-all">
                        儲存作業
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 科目顏色標籤與圖示配置
        const SUBJECT_CONFIG = {
            '國文': { color: 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-200 dark:border-rose-800', icon: 'fa-book' },
            '英文': { color: 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border-indigo-200 dark:border-indigo-800', icon: 'fa-language' },
            '數學': { color: 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-200 dark:border-blue-800', icon: 'fa-square-root-variable' },
            '自然/科學': { color: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800', icon: 'fa-flask' },
            '社會': { color: 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-200 dark:border-amber-800', icon: 'fa-globe' },
            '其他': { color: 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-200 dark:border-purple-800', icon: 'fa-folder' }
        };

        // 優先級設定
        const PRIORITY_CONFIG = {
            'high': { label: '高', badge: 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300' },
            'medium': { label: '中', badge: 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' },
            'low': { label: '低', badge: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' }
        };

        // 應用程式狀態 State（完全預設為空陣列）
        let homeworks = [];
        let currentFilter = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadHomeworks();
            renderHomeworks();
        });

        // 從 LocalStorage 載入資料（若無資料則為空的 []）
        function loadHomeworks() {
            const saved = localStorage.getItem('homeworks_data');
            if (saved) {
                try {
                    homeworks = JSON.parse(saved);
                } catch (e) {
                    homeworks = [];
                }
            } else {
                homeworks = [];
            }
        }

        // 儲存至 LocalStorage
        function saveHo
